<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio — Shishkina Jewelry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: radial-gradient(circle at 50% -20%, #ffffff 0%, #f8f5f0 60%, #f3eee7 100%);
            --card-bg: #ffffff;
            --text-dark: #1a1a1a;
            --text-muted: #888888;
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-page);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
        }

        header {
            padding: 50px 20px 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            max-height: clamp(65px, 9vw, 95px);
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.03));
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.07);
        }

        .card-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #f7f4f0;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover .card-img-wrap img {
            transform: scale(1.03);
        }

        .light-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .light-layer.active {
            opacity: 1;
        }

        .light-btn-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #111;
            cursor: pointer;
        }

        .light-btn-badge .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #bbb;
            transition: background 0.3s ease;
        }

        .light-btn-badge.is-on .indicator {
            background: #ffaa00;
            box-shadow: 0 0 8px #ffaa00;
        }

        .card-footer {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-arrow {
            font-size: 16px;
            color: var(--text-dark);
            transition: transform 0.3s ease;
        }

        .card:hover .card-arrow {
            transform: translateX(3px);
        }

        .viewer {
            position: fixed;
            inset: 0;
            background: rgba(12, 12, 13, 0.97);
            z-index: 9999;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            touch-action: none;
            user-select: none;
            overflow: hidden;
        }

        .viewer.open {
            display: block;
            opacity: 1;
        }

        .viewer-header {
            position: absolute;
            top: 0;
            inset-inline: 0;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .viewer-counter {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .viewer-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .viewer-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
        }

        .viewer-close-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            padding: 0;
            justify-content: center;
            font-size: 18px;
        }

        .viewer-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewer-image-container {
            position: relative;
            max-width: 90vw;
            max-height: 82vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            will-change: transform;
            cursor: grab;
        }

        .viewer-img {
            max-width: 90vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 8px;
            pointer-events: none;
        }

        .viewer-light-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .viewer-light-img.active {
            opacity: 1;
        }

        .viewer-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        @media (min-width: 768px) {
            .viewer-arrow {
                display: flex;
            }
        }

        .viewer-arrow.prev {
            left: 20px;
        }

        .viewer-arrow.next {
            right: 20px;
        }

        @media (max-width: 600px) {
            header {
                padding: 35px 15px 20px;
            }

            .container {
                padding: 0 12px 60px;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card-footer {
                padding: 12px;
            }

            .card-title {
                font-size: 13px;
            }

            .light-btn-badge {
                padding: 4px 8px;
                font-size: 10px;
                top: 8px;
                right: 8px;
            }

            .viewer-image-container,
            .viewer-img,
            .viewer-light-img {
                max-width: 96vw;
                max-height: 75vh;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="img/logo.png" alt="Shishkina Jewelry Company" class="logo-img"
            onerror="this.outerHTML='<h1 style=\'font-size:28px;letter-spacing:3px;\'>SHISHKINA</h1>'">
    </header>

    <div class="container">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <div class="viewer" id="viewer">
        <div class="viewer-header">
            <span class="viewer-counter" id="viewerCounter">1 / 13</span>
            <div class="viewer-controls">
                <button class="viewer-btn" id="viewerLightToggle" style="display: none;">
                    💡 <span>Свет: Выкл</span>
                </button>
                <button class="viewer-btn" id="viewerZoomBtn">🔍 <span>100%</span></button>
                <button class="viewer-btn viewer-close-btn" id="viewerCloseBtn">✕</button>
            </div>
        </div>

        <button class="viewer-arrow prev" id="arrowPrev">‹</button>
        <button class="viewer-arrow next" id="arrowNext">›</button>

        <div class="viewer-stage" id="viewerStage">
            <div class="viewer-image-container" id="viewerContainer">
                <img class="viewer-img" id="viewerBaseImg" src="" alt="Photo">
                <img class="viewer-light-img" id="viewerLightImg" src="" alt="Photo Light On">
            </div>
        </div>
    </div>

    <script>
        const items = [
            // 1. Модельная съёмка со светом
            { type: 'light-switch', title: 'Модель — Образ I', off: 'img/shishkina_model_1_off.png', on: 'img/shishkina_model_1_on.png' },
            { type: 'light-switch', title: 'Модель — Образ II', off: 'img/shishkina_model_2_off.png', on: 'img/shishkina_model_2_on.png' },

            // 2. Предметная съёмка
            { type: 'single', title: 'Предметная сцена I', src: 'img/shishkina_background (1).png' },
            { type: 'single', title: 'Предметная сцена II', src: 'img/shishkina_background (2).png' },
            { type: 'single', title: 'Предметная сцена III', src: 'img/shishkina_background (3).png' },
            { type: 'single', title: 'Предметная сцена IV', src: 'img/shishkina_background (4).png' },
            { type: 'single', title: 'Предметная сцена V', src: 'img/shishkina_background (5).png' },
            { type: 'single', title: 'Предметная сцена VI', src: 'img/shishkina_background (6).png' },

            // 3. Креативные концепции
            { type: 'single', title: 'Концепция — Рука I', src: 'img/shishkina_hand.png' },
            { type: 'single', title: 'Концепция — Рука II', src: 'img/shishkina_hand_2.png' },
            { type: 'single', title: 'Концепция — Белка I', src: 'img/shishkina_belka (1).png' },
            { type: 'single', title: 'Концепция — Белка II', src: 'img/shishkina_belka (2).png' },
            { type: 'single', title: 'Концепция — Белка III', src: 'img/shishkina_belka (3).png' }
        ];

        let currentIndex = 0;
        let isLightOn = false;

        const grid = document.getElementById('galleryGrid');

        items.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';

            if (item.type === 'light-switch') {
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <button class="light-btn-badge" data-index="${index}">
                            <span class="indicator"></span>
                            <span class="label">Свет</span>
                        </button>
                        <img src="${item.off}" alt="${item.title}" loading="lazy">
                        <img src="${item.on}" class="light-layer" alt="${item.title} On" loading="lazy">
                    </div>
                    <div class="card-footer">
                        <span class="card-title">${item.title}</span>
                        <span class="card-arrow">→</span>
                    </div>
                `;

                const badge = card.querySelector('.light-btn-badge');
                const layer = card.querySelector('.light-layer');
                badge.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const active = layer.classList.toggle('active');
                    badge.classList.toggle('is-on', active);
                });
            } else {
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${item.src}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="card-footer">
                        <span class="card-title">${item.title}</span>
                        <span class="card-arrow">→</span>
                    </div>
                `;
            }

            card.addEventListener('click', () => openViewer(index));
            grid.appendChild(card);
        });

        const viewer = document.getElementById('viewer');
        const viewerContainer = document.getElementById('viewerContainer');
        const viewerBaseImg = document.getElementById('viewerBaseImg');
        const viewerLightImg = document.getElementById('viewerLightImg');
        const viewerCounter = document.getElementById('viewerCounter');
        const viewerLightToggle = document.getElementById('viewerLightToggle');
        const viewerZoomBtn = document.getElementById('viewerZoomBtn');

        let zoomScale = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentTranslateX = 0;

        function updateTransform(animate = false) {
            viewerContainer.style.transition = animate ? 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
            if (zoomScale > 1) {
                viewerContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
            } else {
                viewerContainer.style.transform = `translate(${currentTranslateX}px, 0px) scale(1)`;
            }
        }

        function renderSlide() {
            const current = items[currentIndex];
            viewerCounter.textContent = `${currentIndex + 1} / ${items.length}`;
            resetZoom();

            if (current.type === 'light-switch') {
                viewerBaseImg.src = current.off;
                viewerLightImg.src = current.on;
                viewerLightImg.style.display = 'block';
                viewerLightToggle.style.display = 'flex';
                setViewerLight(false);
            } else {
                viewerBaseImg.src = current.src;
                viewerLightImg.style.display = 'none';
                viewerLightToggle.style.display = 'none';
            }
        }

        function setViewerLight(on) {
            isLightOn = on;
            viewerLightImg.classList.toggle('active', isLightOn);
            viewerLightToggle.querySelector('span').textContent = isLightOn ? 'Свет: Вкл' : 'Свет: Выкл';
        }

        viewerLightToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            setViewerLight(!isLightOn);
        });

        function openViewer(index) {
            currentIndex = index;
            viewer.classList.add('open');
            document.body.style.overflow = 'hidden';
            renderSlide();
        }

        function closeViewer() {
            viewer.classList.remove('open');
            document.body.style.overflow = '';
            resetZoom();
        }

        document.getElementById('viewerCloseBtn').addEventListener('click', closeViewer);

        function nextSlide() {
            currentIndex = (currentIndex < items.length - 1) ? currentIndex + 1 : 0;
            renderSlide();
        }

        function prevSlide() {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : items.length - 1;
            renderSlide();
        }

        document.getElementById('arrowNext').addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); });
        document.getElementById('arrowPrev').addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); });

        function toggleZoom() {
            if (zoomScale > 1) {
                resetZoom();
            } else {
                zoomScale = 2.4;
                viewerZoomBtn.querySelector('span').textContent = '240%';
                updateTransform(true);
            }
        }

        function resetZoom() {
            zoomScale = 1;
            panX = 0; panY = 0; currentTranslateX = 0;
            viewerZoomBtn.querySelector('span').textContent = '100%';
            updateTransform(true);
        }

        viewerZoomBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleZoom(); });
        viewerContainer.addEventListener('dblclick', toggleZoom);

        viewer.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoomScale = Math.min(Math.max(1, zoomScale + e.deltaY * -0.005), 4);
            viewerZoomBtn.querySelector('span').textContent = `${Math.round(zoomScale * 100)}%`;
            if (zoomScale === 1) { panX = 0; panY = 0; }
            updateTransform(false);
        }, { passive: false });

        const stage = document.getElementById('viewerStage');

        stage.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            stage.setPointerCapture(e.pointerId);
        });

        stage.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (zoomScale > 1) {
                panX += dx;
                panY += dy;
                startX = e.clientX;
                startY = e.clientY;
                updateTransform(false);
            } else {
                currentTranslateX = dx;
                updateTransform(false);
            }
        });

        stage.addEventListener('pointerup', () => {
            if (!isDragging) return;
            isDragging = false;

            if (zoomScale === 1) {
                const threshold = window.innerWidth * 0.18;
                if (currentTranslateX < -threshold) {
                    currentTranslateX = -window.innerWidth;
                    updateTransform(true);
                    setTimeout(() => { currentTranslateX = 0; nextSlide(); }, 180);
                } else if (currentTranslateX > threshold) {
                    currentTranslateX = window.innerWidth;
                    updateTransform(true);
                    setTimeout(() => { currentTranslateX = 0; prevSlide(); }, 180);
                } else {
                    currentTranslateX = 0;
                    updateTransform(true);
                }
            }
        });

        stage.addEventListener('pointercancel', () => {
            isDragging = false;
            currentTranslateX = 0;
            updateTransform(true);
        });

        document.addEventListener('keydown', (e) => {
            if (!viewer.classList.contains('open')) return;
            if (e.key === 'Escape') closeViewer();
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
    </script>
</body>

</html>
