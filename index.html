<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shishkina Jewelry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: radial-gradient(circle at 50% -20%, #ffffff 0%, #f8f5f0 60%, #f3eee7 100%);
            --card-bg: #ffffff;
            --text-dark: #1a1a1a;
            --text-muted: #888888;
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-page);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
        }

        header {
            padding: 50px 20px 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            max-height: clamp(65px, 9vw, 95px);
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.03));
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.07);
        }

        .card-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #f7f4f0;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover .card-img-wrap img {
            transform: scale(1.03);
        }

        .light-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .light-layer.active {
            opacity: 1;
        }

        @keyframes light-flicker {

            0%,
            100% {
                border-color: rgba(255, 180, 0, 0.35);
                box-shadow: 0 0 6px rgba(255, 180, 0, 0.15);
            }

            45% {
                border-color: rgba(255, 205, 0, 0.85);
                box-shadow: 0 0 16px rgba(255, 180, 0, 0.55), inset 0 0 8px rgba(255, 200, 0, 0.2);
            }

            60% {
                border-color: rgba(255, 170, 0, 0.45);
                box-shadow: 0 0 8px rgba(255, 170, 0, 0.25);
            }

            75% {
                border-color: rgba(255, 215, 0, 0.95);
                box-shadow: 0 0 20px rgba(255, 190, 0, 0.7), inset 0 0 10px rgba(255, 210, 0, 0.3);
            }
        }

        .light-btn-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 5;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 180, 0, 0.4);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #111;
            cursor: pointer;
            animation: light-flicker 2.8s infinite ease-in-out;
            transition: background 0.2s ease;
        }

        .light-btn-badge .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #bbb;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .light-btn-badge.is-on .indicator {
            background: #ffaa00;
            box-shadow: 0 0 10px #ffaa00;
        }

        .card-footer {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-arrow {
            font-size: 16px;
            color: var(--text-dark);
            transition: transform 0.3s ease;
        }

        .card:hover .card-arrow {
            transform: translateX(3px);
        }

        /* --- Viewer --- */
        .viewer {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 11, 0.98);
            z-index: 9999;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            touch-action: none;
            user-select: none;
            overflow: hidden;
        }

        .viewer.open {
            display: block;
            opacity: 1;
        }

        /* Верхняя панель: Название, счетчик и крестик */
        .viewer-header {
            position: absolute;
            top: 0;
            inset-inline: 0;
            height: 76px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, transparent 100%);
        }

        .viewer-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .viewer-category {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.12);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 260px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .viewer-counter {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 30px;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .viewer-close-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            backdrop-filter: blur(14px);
            transition: var(--transition);
        }

        .viewer-close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Нижний отцентрованный бар (всегда по центру снизу) */
        .viewer-bottom-controls {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(24, 24, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 6px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
        }

        .viewer-btn-light {
            background: rgba(255, 255, 255, 0.14);
            border: 1.5px solid rgba(255, 180, 0, 0.5);
            color: #fff;
            height: 44px;
            padding: 0 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(14px);
            animation: light-flicker 2.8s infinite ease-in-out;
            transition: background 0.25s ease;
        }

        .zoom-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            height: 44px;
            padding: 2px 6px;
            backdrop-filter: blur(14px);
        }

        .zoom-btn {
            background: none;
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            font-size: 22px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s ease;
        }

        .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .zoom-display {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 0 8px;
            min-width: 48px;
            text-align: center;
        }

        /* Стрелки */
        .viewer-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: var(--transition);
        }

        .viewer-arrow:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        @media (min-width: 768px) {
            .viewer-arrow {
                display: flex;
            }
        }

        .viewer-arrow.prev {
            left: 24px;
        }

        .viewer-arrow.next {
            right: 24px;
        }

        /* Трек и контейнер фото */
        .viewer-stage {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .viewer-track {
            display: flex;
            width: 300vw;
            height: 100%;
            transform: translateX(-100vw);
            will-change: transform;
        }

        .viewer-slide-slot {
            width: 100vw;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .viewer-image-wrap {
            position: relative;
            display: inline-grid;
            grid-template-areas: "stack";
            place-items: center;
            max-width: 90vw;
            max-height: 76vh;
            width: fit-content;
            height: fit-content;
            will-change: transform;
            transform-origin: center center;
        }

        .viewer-image-wrap img {
            grid-area: stack;
            max-width: 90vw;
            max-height: 76vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            pointer-events: none;
            user-select: none;
            display: block;
        }

        .viewer-image-wrap .light-img {
            grid-area: stack;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .viewer-image-wrap .light-img.active {
            opacity: 1;
        }

        @media (max-width: 600px) {
            header {
                padding: 35px 15px 20px;
            }

            .container {
                padding: 0 12px 60px;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card-footer {
                padding: 12px;
            }

            .card-title {
                font-size: 13px;
            }

            .light-btn-badge {
                padding: 6px 12px;
                font-size: 11px;
                top: 8px;
                right: 8px;
            }

            .viewer-header {
                height: 68px;
                padding: 0 16px;
            }

            .viewer-category {
                font-size: 13px;
                padding: 6px 12px;
                max-width: 170px;
            }

            .viewer-counter {
                font-size: 13px;
                padding: 6px 10px;
            }

            .viewer-close-btn {
                width: 42px;
                height: 42px;
                font-size: 20px;
            }

            .viewer-bottom-controls {
                bottom: 20px;
                padding: 5px 8px;
                gap: 8px;
            }

            .viewer-btn-light {
                height: 42px;
                padding: 0 16px;
                font-size: 13px;
            }

            .zoom-group {
                height: 42px;
            }

            .viewer-image-wrap,
            .viewer-image-wrap img {
                max-width: 96vw;
                max-height: 70vh;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="img/logo.png" alt="Shishkina Jewelry Company" class="logo-img"
            onerror="this.outerHTML='<h1 style=\'font-size:28px;letter-spacing:3px;\'>SHISHKINA</h1>'">
    </header>

    <div class="container">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- Viewer -->
    <div class="viewer" id="viewer">
        <!-- Верх: Название, счетчик и крестик -->
        <div class="viewer-header">
            <div class="viewer-meta">
                <span class="viewer-category" id="viewerCategory">Образ</span>
                <span class="viewer-counter" id="viewerCounter">1 / 13</span>
            </div>
            <button class="viewer-close-btn" id="viewerCloseBtn" title="Закрыть">✕</button>
        </div>

        <button class="viewer-arrow prev" id="arrowPrev" title="Предыдущее">‹</button>
        <button class="viewer-arrow next" id="arrowNext" title="Следующее">›</button>

        <div class="viewer-stage" id="viewerStage">
            <div class="viewer-track" id="viewerTrack">
                <div class="viewer-slide-slot" id="slotPrev"></div>
                <div class="viewer-slide-slot" id="slotCurr"></div>
                <div class="viewer-slide-slot" id="slotNext"></div>
            </div>
        </div>

        <!-- Низ по центру: Свет и Увеличение -->
        <div class="viewer-bottom-controls">
            <button class="viewer-btn-light" id="viewerLightToggle" style="display: none;">
                💡 <span>Свет: Выкл</span>
            </button>

            <div class="zoom-group">
                <button class="zoom-btn" id="zoomOutBtn" title="Уменьшить">−</button>
                <span class="zoom-display" id="zoomDisplay">100%</span>
                <button class="zoom-btn" id="zoomInBtn" title="Увеличить">+</button>
            </div>
        </div>
    </div>

    <script>
        const items = [
            { type: 'light-switch', title: 'Модель — Образ I', off: 'img/shishkina_model_1_off.jpg', on: 'img/shishkina_model_1_on.jpg' },
            { type: 'light-switch', title: 'Модель — Образ II', off: 'img/shishkina_model_2_off.jpg', on: 'img/shishkina_model_2_on.jpg' },
            { type: 'single', title: 'Предметная сцена I', src: 'img/shishkina_background (1).jpg' },
            { type: 'single', title: 'Предметная сцена II', src: 'img/shishkina_background (2).jpg' },
            { type: 'single', title: 'Предметная сцена III', src: 'img/shishkina_background (3).jpg' },
            { type: 'single', title: 'Предметная сцена IV', src: 'img/shishkina_background (4).jpg' },
            { type: 'single', title: 'Предметная сцена V', src: 'img/shishkina_background (5).jpg' },
            { type: 'single', title: 'Предметная сцена VI', src: 'img/shishkina_background (6).jpg' },
            { type: 'single', title: 'Концепция — Рука I', src: 'img/shishkina_hand.jpg' },
            { type: 'single', title: 'Концепция — Рука II', src: 'img/shishkina_hand_2.jpg' },
            { type: 'single', title: 'Концепция — Белка I', src: 'img/shishkina_belka (1).jpg' },
            { type: 'single', title: 'Концепция — Белка II', src: 'img/shishkina_belka (2).jpg' },
            { type: 'single', title: 'Концепция — Белка III', src: 'img/shishkina_belka (3).jpg' }
        ];

        let currentIndex = 0;
        let isLightOn = false;

        const grid = document.getElementById('galleryGrid');

        items.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';

            if (item.type === 'light-switch') {
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <button class="light-btn-badge" data-index="${index}">
                            <span class="indicator"></span>
                            <span class="label">Свет</span>
                        </button>
                        <img src="${item.off}" alt="${item.title}" loading="lazy">
                        <img src="${item.on}" class="light-layer" alt="${item.title} On" loading="lazy">
                    </div>
                    <div class="card-footer">
                        <span class="card-title">${item.title}</span>
                        <span class="card-arrow">→</span>
                    </div>
                `;

                const badge = card.querySelector('.light-btn-badge');
                const layer = card.querySelector('.light-layer');
                badge.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const active = layer.classList.toggle('active');
                    badge.classList.toggle('is-on', active);
                });
            } else {
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${item.src}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="card-footer">
                        <span class="card-title">${item.title}</span>
                        <span class="card-arrow">→</span>
                    </div>
                `;
            }

            card.addEventListener('click', () => openViewer(index));
            grid.appendChild(card);
        });

        /* --- Viewer Logic --- */
        const viewer = document.getElementById('viewer');
        const track = document.getElementById('viewerTrack');
        const slotPrev = document.getElementById('slotPrev');
        const slotCurr = document.getElementById('slotCurr');
        const slotNext = document.getElementById('slotNext');
        const viewerCategory = document.getElementById('viewerCategory');
        const viewerCounter = document.getElementById('viewerCounter');
        const viewerLightToggle = document.getElementById('viewerLightToggle');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomDisplay = document.getElementById('zoomDisplay');

        const zoomLevels = [1, 1.5, 2, 2.5, 3];
        let currentZoomIndex = 0;
        let panX = 0, panY = 0;

        let isDragging = false;
        let startX = 0, startY = 0;
        let currentDragX = 0;
        let isAnimating = false;

        function createSlideHTML(item) {
            if (item.type === 'light-switch') {
                return `
                    <div class="viewer-image-wrap">
                        <img src="${item.off}" alt="${item.title}">
                        <img src="${item.on}" class="light-img ${isLightOn ? 'active' : ''}" alt="${item.title} On">
                    </div>
                `;
            }
            return `
                <div class="viewer-image-wrap">
                    <img src="${item.src}" alt="${item.title}">
                </div>
            `;
        }

        function renderSlides() {
            const total = items.length;
            const prevIdx = (currentIndex - 1 + total) % total;
            const nextIdx = (currentIndex + 1) % total;

            slotPrev.innerHTML = createSlideHTML(items[prevIdx]);
            slotCurr.innerHTML = createSlideHTML(items[currentIndex]);
            slotNext.innerHTML = createSlideHTML(items[nextIdx]);

            const currentItem = items[currentIndex];
            viewerCategory.textContent = currentItem.title;
            viewerCounter.textContent = `${currentIndex + 1} / ${total}`;

            if (currentItem.type === 'light-switch') {
                viewerLightToggle.style.display = 'flex';
                updateLightState(isLightOn);
            } else {
                viewerLightToggle.style.display = 'none';
            }

            resetZoom();
            resetTrackPosition();
        }

        function resetTrackPosition() {
            track.style.transition = 'none';
            track.style.transform = 'translateX(-100vw)';
            currentDragX = 0;
        }

        function updateLightState(on) {
            isLightOn = on;
            const currLight = slotCurr.querySelector('.light-img');
            if (currLight) currLight.classList.toggle('active', isLightOn);
            viewerLightToggle.querySelector('span').textContent = isLightOn ? 'Свет: Вкл' : 'Свет: Выкл';
        }

        viewerLightToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            updateLightState(!isLightOn);
        });

        /* Zoom управление */
        function applyZoom(animate = true) {
            const currWrap = slotCurr.querySelector('.viewer-image-wrap');
            if (!currWrap) return;

            const scale = zoomLevels[currentZoomIndex];
            zoomDisplay.textContent = `${Math.round(scale * 100)}%`;

            currWrap.style.transition = animate ? 'transform 0.25s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
            if (scale > 1) {
                currWrap.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            } else {
                panX = 0; panY = 0;
                currWrap.style.transform = 'none';
            }
        }

        function resetZoom() {
            currentZoomIndex = 0;
            panX = 0; panY = 0;
            applyZoom(false);
        }

        zoomInBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentZoomIndex < zoomLevels.length - 1) {
                currentZoomIndex++;
                applyZoom(true);
            }
        });

        zoomOutBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentZoomIndex > 0) {
                currentZoomIndex--;
                applyZoom(true);
            }
        });

        slotCurr.addEventListener('dblclick', () => {
            currentZoomIndex = (currentZoomIndex === 0) ? 2 : 0;
            applyZoom(true);
        });

        viewer.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0 && currentZoomIndex < zoomLevels.length - 1) {
                currentZoomIndex++;
                applyZoom(true);
            } else if (e.deltaY > 0 && currentZoomIndex > 0) {
                currentZoomIndex--;
                applyZoom(true);
            }
        }, { passive: false });

        /* Карусель и свайп */
        const stage = document.getElementById('viewerStage');

        stage.addEventListener('pointerdown', (e) => {
            if (isAnimating) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            stage.setPointerCapture(e.pointerId);
        });

        stage.addEventListener('pointermove', (e) => {
            if (!isDragging || isAnimating) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (zoomLevels[currentZoomIndex] > 1) {
                panX += dx;
                panY += dy;
                startX = e.clientX;
                startY = e.clientY;
                applyZoom(false);
            } else {
                currentDragX = dx;
                track.style.transition = 'none';
                track.style.transform = `translateX(calc(-100vw + ${currentDragX}px))`;
            }
        });

        stage.addEventListener('pointerup', () => {
            if (!isDragging) return;
            isDragging = false;

            if (zoomLevels[currentZoomIndex] === 1) {
                const threshold = window.innerWidth * 0.16;

                if (currentDragX < -threshold) {
                    slideNext();
                } else if (currentDragX > threshold) {
                    slidePrev();
                } else {
                    track.style.transition = 'transform 0.25s ease-out';
                    track.style.transform = 'translateX(-100vw)';
                }
            }
        });

        stage.addEventListener('pointercancel', () => {
            isDragging = false;
            resetTrackPosition();
        });

        function slideNext() {
            if (isAnimating) return;
            isAnimating = true;
            track.style.transition = 'transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)';
            track.style.transform = 'translateX(-200vw)';

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % items.length;
                renderSlides();
                isAnimating = false;
            }, 280);
        }

        function slidePrev() {
            if (isAnimating) return;
            isAnimating = true;
            track.style.transition = 'transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)';
            track.style.transform = 'translateX(0vw)';

            setTimeout(() => {
                currentIndex = (currentIndex - 1 + items.length) % items.length;
                renderSlides();
                isAnimating = false;
            }, 280);
        }

        document.getElementById('arrowNext').addEventListener('click', (e) => { e.stopPropagation(); slideNext(); });
        document.getElementById('arrowPrev').addEventListener('click', (e) => { e.stopPropagation(); slidePrev(); });

        function openViewer(index) {
            currentIndex = index;
            viewer.classList.add('open');
            document.body.style.overflow = 'hidden';
            renderSlides();
        }

        function closeViewer() {
            viewer.classList.remove('open');
            document.body.style.overflow = '';
            resetZoom();
        }

        document.getElementById('viewerCloseBtn').addEventListener('click', closeViewer);

        document.addEventListener('keydown', (e) => {
            if (!viewer.classList.contains('open')) return;
            if (e.key === 'Escape') closeViewer();
            if (e.key === 'ArrowRight') slideNext();
            if (e.key === 'ArrowLeft') slidePrev();
        });
    </script>
</body>

</html>
